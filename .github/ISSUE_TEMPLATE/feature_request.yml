name: Feature request
description: Suggest an improvement for Game Lab
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the game-testing workflow that is awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the page / host do? Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other emulators, scripts, or plugin designs you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Live view / performance
        - Input / controls
        - Build & Play
        - Game library
        - AVD / emulator lifecycle
        - Documentation / developer experience
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked docs/ROADMAP.md and this is not already listed.
          required: true
