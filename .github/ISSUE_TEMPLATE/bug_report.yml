name: Bug report
description: Report a defect in Game Lab (do not include secrets or private data)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact usernames, tokens, private game
        names and absolute paths before pasting logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, short description of the bug and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start emulator
        2. Press Play on ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Live view mode
      options:
        - Smooth (H.264 / WebCodecs)
        - Compat (PNG)
        - Not sure / the page did not open
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version and profile
      placeholder: "0.2.2-rc.1, desktop profile"
  - type: input
    id: os
    attributes:
      label: OS and Android SDK / emulator versions
      placeholder: "Windows 11 24H2, emulator 37.2.13, system image android-34 google_apis x86_64"
  - type: textarea
    id: status
    attributes:
      label: /status JSON (redacted)
      description: GET /_dsh/game-lab/status. Remove personal paths/names if needed.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Build log tail, logcat excerpt, browser console error.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, tokens and private game/project names from this report.
          required: true
        - label: I tried the Compat view toggle (for live-view issues).
          required: false
